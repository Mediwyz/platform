<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wyzo WebRTC peer test</title>
  <style>
    body { font-family: sans-serif; background:#02132a; color:#fff; margin:0; }
    #bar { padding:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input { padding:6px 8px; border-radius:6px; border:1px solid #335; background:#001a30; color:#fff; }
    button { padding:6px 12px; border-radius:6px; border:0; background:#0C6780; color:#fff; cursor:pointer; }
    #status { font-weight:700; }
    video { width:48%; background:#000; margin:1%; border-radius:8px; }
    #log { padding:10px; font-size:12px; white-space:pre-wrap; height:130px; overflow:auto; background:#001024; }
  </style>
</head>
<body>
  <div id="bar">
    Room: <input id="room" value="mediwyz-demo" />
    <button id="join">Join</button>
    <span id="status">idle</span>
  </div>
  <div><video id="local" autoplay playsinline muted></video><video id="remote" autoplay playsinline></video></div>
  <div id="log"></div>
  <!-- Same-origin: socket.io served by this very host, so the CORS origin is allowed. -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const logEl = document.getElementById('log'), statusEl = document.getElementById('status');
    const log = (m) => { logEl.textContent += m + "\n"; logEl.scrollTop = logEl.scrollHeight; };
    const setStatus = (s) => statusEl.textContent = s;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
    let pc = null, peerId = null, localStream = null, socket = null;

    async function ensurePc(pid) {
      if (pc) return pc;
      peerId = pid;
      pc = new RTCPeerConnection(config);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.onicecandidate = (e) => { if (e.candidate) socket.emit('ice-candidate', { to: peerId, candidate: e.candidate.toJSON() }); };
      pc.ontrack = (e) => { log('★ remote track — CONNECTED'); setStatus('CONNECTED ✅'); document.getElementById('remote').srcObject = e.streams[0]; };
      pc.onconnectionstatechange = () => { log('pc: ' + pc.connectionState); if (pc.connectionState === 'connected') setStatus('CONNECTED ✅'); };
      return pc;
    }

    async function join() {
      const ROOM = document.getElementById('room').value.trim() || 'mediwyz-demo';
      setStatus('getting camera…');
      try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true }); document.getElementById('local').srcObject = localStream; log('got local media'); }
      catch (err) { log('getUserMedia failed: ' + err); setStatus('no camera/mic'); return; }
      socket = io({ transports: ['websocket', 'polling'], forceNew: true });
      socket.on('connect', () => { log('socket connected ' + socket.id); setStatus('joining ' + ROOM + '…'); socket.emit('join-room', { roomId: ROOM, userId: 'pc-' + Date.now(), userName: 'PC Peer', userType: 'doctor' }); });
      socket.on('existing-participants', async (d) => {
        const parts = d.participants || []; log('existing: ' + parts.map(p=>p.socketId).join(','));
        if (parts.length) { await ensurePc(parts[0].socketId); const o = await pc.createOffer(); await pc.setLocalDescription(o); socket.emit('offer', { to: parts[0].socketId, offer: o }); log('sent offer'); setStatus('calling…'); }
        else setStatus('waiting for phone to join…');
      });
      socket.on('user-joined', (p) => { log('user-joined ' + p.socketId); setStatus('peer joined…'); });
      socket.on('offer', async (d) => { log('got offer'); await ensurePc(d.from); await pc.setRemoteDescription(new RTCSessionDescription(d.offer)); const a = await pc.createAnswer(); await pc.setLocalDescription(a); socket.emit('answer', { to: d.from, answer: a }); log('sent answer'); });
      socket.on('answer', async (d) => { log('got answer'); await pc.setRemoteDescription(new RTCSessionDescription(d.answer)); });
      socket.on('ice-candidate', async (d) => { try { await pc.addIceCandidate(new RTCIceCandidate(d.candidate)); } catch (e) { log('ice err ' + e); } });
      socket.on('connect_error', (e) => { log('connect_error: ' + e.message); setStatus('socket error'); });
      socket.on('user-left', () => { log('peer left'); setStatus('peer left'); });
    }
    document.getElementById('join').onclick = join;
    // auto-join on load
    join();
  </script>
</body>
</html>
