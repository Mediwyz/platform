name: Fix VPS — Grant sudo + Open 443 + Install Caddy

on:
  workflow_dispatch:

jobs:
  fix:
    name: Fix VPS permissions and install Caddy
    runs-on: [self-hosted, mediwyz]
    steps:
      - name: Grant runner passwordless sudo via Docker
        run: |
          RUNNER_USER="$(whoami)"
          echo "Runner is running as: $RUNNER_USER"
          docker run --rm \
            -v /etc:/host-etc \
            -v /usr/sbin:/host-usrsbin \
            alpine sh -c "
              echo '${RUNNER_USER} ALL=(ALL) NOPASSWD: ALL' > /host-etc/sudoers.d/runner-nopasswd
              chmod 440 /host-etc/sudoers.d/runner-nopasswd
              echo 'Sudoers entry written for ${RUNNER_USER}'
            "

      - name: Verify sudo works
        run: sudo id

      - name: Open ports 80 + 443 in UFW
        run: |
          sudo ufw allow 80/tcp || true
          sudo ufw allow 443/tcp || true
          sudo ufw --force enable || true
          sudo ufw status

      - name: Install Caddy (official apt repo)
        run: |
          if command -v caddy >/dev/null 2>&1; then
            echo "Caddy already installed: $(caddy version)"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
            | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
          caddy version

      - name: Stop and disable nginx if present
        run: |
          sudo systemctl stop nginx 2>/dev/null || true
          sudo systemctl disable nginx 2>/dev/null || true
          echo "nginx stopped (if it was running)"

      - name: Write Caddy environment (APP_DOMAIN)
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          sudo mkdir -p /etc/systemd/system/caddy.service.d
          printf '[Service]\nEnvironment="APP_DOMAIN=%s"\n' "$APP_DOMAIN" \
            | sudo tee /etc/systemd/system/caddy.service.d/mediwyz.conf > /dev/null
          sudo systemctl daemon-reload
          echo "Caddy environment set: APP_DOMAIN=$APP_DOMAIN"

      - name: Write Caddyfile
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          DOMAIN="$APP_DOMAIN"
          {
            echo "${DOMAIN}, www.${DOMAIN} {"
            echo "    reverse_proxy /socket.io/* localhost:3001"
            echo "    reverse_proxy localhost:3000"
            echo "    encode gzip"
            echo "}"
          } | sudo tee /etc/caddy/Caddyfile > /dev/null
          cat /etc/caddy/Caddyfile
          sudo caddy validate --config /etc/caddy/Caddyfile && echo "Caddyfile valid"

      - name: Enable and start Caddy
        run: |
          sudo systemctl enable caddy
          sudo systemctl restart caddy
          sleep 8
          sudo systemctl is-active caddy && echo "Caddy is running"
          sudo journalctl -u caddy --no-pager -n 20

      - name: Verify HTTPS
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          echo "Waiting up to 60s for Caddy to provision the TLS cert..."
          for i in $(seq 1 12); do
            sleep 5
            if curl -sf --max-time 5 "https://$APP_DOMAIN" > /dev/null 2>&1; then
              echo "HTTPS is live after $((i * 5))s"
              curl -sI "https://$APP_DOMAIN" | head -5
              exit 0
            fi
            echo "Still waiting... ($((i * 5))s)"
          done
          echo "HTTPS not responding yet — Caddy may still be obtaining the cert."
          curl -sI "http://$APP_DOMAIN" | head -3 || true
