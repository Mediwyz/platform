name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs on the same branch so stale deploys never queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint & Type Check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Type check (frontend)
        run: npx tsc --noEmit

      - name: Type check (backend)
        run: cd backend && npm ci && npx tsc --noEmit

      - name: Lint (frontend)
        run: npx eslint . --max-warnings=-1

  # ─── Unit Tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Run frontend unit tests (Vitest)
        run: npx vitest run --exclude='__tests__/**'

      - name: Run backend unit tests (Jest)
        run: cd backend && npm ci && npx jest --passWithNoTests --forceExit

  # ─── Build Docker Images (parallel) ──────────────────────────────────────
  build-frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag and app URL
        id: meta
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:latest
          IMAGE_TAG=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          DOMAIN="${{ secrets.APP_DOMAIN }}"
          if [ -n "$DOMAIN" ]; then
            APP_URL="https://$DOMAIN"
          else
            APP_URL="http://${{ secrets.VPS_HOST }}"
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "app_url=$APP_URL"     >> $GITHUB_OUTPUT

      - name: Build and push Next.js image
        run: |
          docker pull ${{ steps.meta.outputs.image_tag }} 2>/dev/null || true
          docker build \
            --cache-from ${{ steps.meta.outputs.image_tag }} \
            --build-arg NEXT_PUBLIC_APP_URL=${{ steps.meta.outputs.app_url }} \
            --build-arg NEXT_PUBLIC_SOCKET_URL=${{ steps.meta.outputs.app_url }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.meta.outputs.app_url }} \
            --build-arg API_INTERNAL_URL=http://api:3001 \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            -t ${{ steps.meta.outputs.image_tag }} \
            -f Dockerfile \
            .
          docker push ${{ steps.meta.outputs.image_tag }}

  build-backend:
    name: Build Backend (NestJS)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest
          IMAGE_TAG=$(echo "$IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push NestJS image
        run: |
          docker pull ${{ steps.meta.outputs.image_tag }} 2>/dev/null || true
          docker build \
            --cache-from ${{ steps.meta.outputs.image_tag }} \
            -t ${{ steps.meta.outputs.image_tag }} \
            -f backend/Dockerfile \
            .
          docker push ${{ steps.meta.outputs.image_tag }}

  # ─── Deploy to Hostinger VPS ─────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, mediwyz]
    needs: [build-frontend, build-backend]
    steps:
      - name: Deploy on VPS
        run: |
          set -e
          DEPLOY_DIR="${{ secrets.DEPLOY_DIR || 'mediwyz' }}"

          # Auto-recreate deploy dir if it was lost (e.g. after VPS reboot/cleanup)
          if [ ! -d "/root/$DEPLOY_DIR" ]; then
            echo "Deploy dir /root/$DEPLOY_DIR missing — cloning fresh..."
            sudo mkdir -p /root/$DEPLOY_DIR
            sudo git clone https://github.com/Mediwyz/platform.git /root/$DEPLOY_DIR
            sudo chmod 755 /root
            sudo chown -R "$(whoami):$(whoami)" /root/$DEPLOY_DIR
          fi

          cd /root/$DEPLOY_DIR

          # Ensure remote points to correct org URL (idempotent)
          git remote set-url origin https://github.com/Mediwyz/platform.git 2>/dev/null || true

          # Pull latest code (docker-compose.yml, prisma schema, seeds)
          git pull origin main 2>/dev/null || true

          # ── Write .env from GitHub Secrets ────────────────────────────────
          echo "Writing .env..."
          cat > .env <<ENVEOF
          DATABASE_URL=$DB_URL
          GROQ_API_KEY=$GROQ_API_KEY
          JWT_SECRET=$JWT_SECRET
          PORT=3000
          API_PORT=3001
          NODE_ENV=production
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          NEXT_PUBLIC_SOCKET_URL=$APP_URL
          NEXT_PUBLIC_APP_URL=$APP_URL
          NEXT_PUBLIC_API_URL=$APP_URL
          API_INTERNAL_URL=http://api:3001
          CORS_ALLOWED_ORIGINS=$APP_URL
          SUPER_ADMIN_EMAIL=$SUPER_ADMIN_EMAIL
          SUPER_ADMIN_PASSWORD=$SUPER_ADMIN_PASSWORD
          SUPER_ADMIN_FIRST_NAME=$SUPER_ADMIN_FIRST_NAME
          SUPER_ADMIN_LAST_NAME=$SUPER_ADMIN_LAST_NAME
          APP_DOMAIN=$APP_DOMAIN
          NEXT_PUBLIC_SENTRY_DSN=$SENTRY_DSN
          SENTRY_DSN=$SENTRY_DSN
          SENTRY_ORG=$SENTRY_ORG
          SENTRY_PROJECT=$SENTRY_PROJECT
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env
          echo ".env written ($(wc -l < .env) vars)"

          # ── Clean up legacy container names (one-time) ────────────────────
          docker stop healthwyz-app healthwyz-db omd-app omd-db 2>/dev/null || true
          docker rm  healthwyz-app healthwyz-db omd-app omd-db 2>/dev/null || true

          # ── Free disk space ───────────────────────────────────────────────
          echo "=== Freeing disk space ==="
          docker image prune -af --filter "until=24h" 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          journalctl --vacuum-size=50M 2>/dev/null || true
          rm -rf /tmp/* 2>/dev/null || true
          echo "Disk after cleanup: $(df -h / | tail -1 | awk '{print $5}')"

          # ── Pull both new images ──────────────────────────────────────────
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker pull "$FRONTEND_IMAGE"
          docker pull "$BACKEND_IMAGE"

          # Tag images so docker-compose can use them by name
          docker tag "$FRONTEND_IMAGE" mediwyz-app:latest
          docker tag "$BACKEND_IMAGE"  mediwyz-api:latest

          # ── Start services in dependency order: db → api → app ────────────
          echo "=== Starting database ==="
          # Remove any container with the same name that compose doesn't own
          # (happens when compose project labels drift between deploys).
          # The pgdata volume is untouched by container removal, so data is safe.
          docker rm -f mediwyz-db 2>/dev/null || true
          docker compose up -d db
          echo "Waiting for DB to be healthy..."
          for i in $(seq 1 12); do
            sleep 5
            if docker compose exec -T db pg_isready -U mediwyz > /dev/null 2>&1; then
              echo "DB ready after $((i * 5))s"
              break
            fi
            echo "Still waiting for DB... ($((i * 5))s)"
          done

          echo "=== Starting API (NestJS) ==="
          docker rm -f mediwyz-api 2>/dev/null || true
          docker compose up -d --no-build --force-recreate api

          echo "Waiting for API to be healthy..."
          API_READY=false
          for i in $(seq 1 24); do
            sleep 5
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "API ready after $((i * 5))s"
              API_READY=true
              break
            fi
            echo "Still waiting for API... ($((i * 5))s)"
          done
          if [ "$API_READY" = "false" ]; then
            echo "=== API FAILED TO START — logs ==="
            docker compose logs --tail=60 api || true
            exit 1
          fi

          echo "=== Starting Frontend (Next.js) ==="
          docker rm -f mediwyz-app 2>/dev/null || true
          docker compose up -d --no-build --force-recreate app

          echo "Waiting for frontend to be healthy..."
          APP_READY=false
          for i in $(seq 1 24); do
            sleep 5
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend ready after $((i * 5))s"
              APP_READY=true
              break
            fi
            echo "Still waiting for frontend... ($((i * 5))s)"
          done
          if [ "$APP_READY" = "false" ]; then
            echo "=== FRONTEND FAILED TO START — logs ==="
            docker compose logs --tail=60 app || true
            exit 1
          fi

          # ── Migrations & seed run in the API container ───────────────────
          # Use the api container's local Prisma 6 CLI (node_modules/.bin/prisma)
          # so we never accidentally download Prisma 7 via npx, which rejects the
          # Prisma 6 schema and silently leaves the DB empty.
          echo "=== Running manual SQL migrations ==="
          docker compose exec -T api sh -c '
            for sql_file in prisma/sql/*.sql; do
              [ -f "$sql_file" ] || continue
              echo "Running: $sql_file"
              node_modules/.bin/prisma db execute \
                --file "$sql_file" \
                --schema ./prisma/schema.prisma 2>&1 \
              || echo "WARNING: $sql_file may have already been applied"
            done
          '

          echo "=== Applying schema migrations ==="
          # Count committed Prisma migration files (excludes manual/ SQL scripts).
          MIGRATION_COUNT=$(docker compose exec -T api sh -c \
            'find prisma/migrations -name "migration.sql" 2>/dev/null | wc -l' \
            | tr -d '[:space:]')
          echo "Committed migration files found: $MIGRATION_COUNT"

          if [ "${MIGRATION_COUNT}" -gt 0 ]; then
            # Detect baseline scenario: DB already has tables (managed by db push)
            # but Prisma has never tracked migrations (_prisma_migrations missing).
            # In that case, mark every committed migration as "already applied" so
            # migrate deploy skips them and only runs truly new future migrations.
            DB_HAS_TABLES=$(docker compose exec -T db \
              psql -U mediwyz -d mediwyz -tAc \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';" \
              | tr -d '[:space:]')
            MIGRATIONS_TRACKED=$(docker compose exec -T db \
              psql -U mediwyz -d mediwyz -tAc \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='_prisma_migrations';" \
              | tr -d '[:space:]')

            if [ "${DB_HAS_TABLES:-0}" -gt 0 ] && [ "${MIGRATIONS_TRACKED:-0}" -eq 0 ]; then
              echo "Existing DB (${DB_HAS_TABLES} tables, no migration history) — marking all migrations as applied..."
              docker compose exec -T api sh -c \
                'find prisma/migrations -mindepth 1 -maxdepth 1 -type d | sort | while read dir; do
                   name=$(basename "$dir")
                   echo "  Resolving: $name"
                   node_modules/.bin/prisma migrate resolve \
                     --applied "$name" \
                     --schema=./prisma/schema.prisma 2>&1 || true
                 done'
              echo "Baseline resolved — future schema changes will use migrate deploy."
            fi

            echo "Running prisma migrate deploy..."
            docker compose exec -T api \
              node_modules/.bin/prisma migrate deploy \
                --schema=./prisma/schema.prisma \
            && echo "migrate deploy: OK" \
            || {
              echo "ERROR: migrate deploy failed — check prisma/migrations/ for conflicts."
              exit 1
            }
          else
            echo "No migration files — syncing schema with prisma db push..."
            docker compose exec -T api \
              node_modules/.bin/prisma db push \
                --schema=./prisma/schema.prisma \
                --accept-data-loss \
            || {
              echo "ERROR: prisma db push --accept-data-loss also failed."
              if [ "${ALLOW_DB_RESET}" = "true" ]; then
                echo "ALLOW_DB_RESET=true — wiping DB (all data will be lost)..."
                docker compose exec -T api \
                  node_modules/.bin/prisma db push \
                    --schema=./prisma/schema.prisma \
                    --force-reset
              else
                echo "Set ALLOW_DB_RESET=true in GitHub Secrets only if data loss is acceptable."
                echo "Aborting deploy to protect production data."
                exit 1
              fi
            }
          fi

          echo "=== Seeding database ==="
          docker compose exec -T api sh -c "
            node_modules/.bin/ts-node \
              --skipProject \
              --transpile-only \
              --compiler-options '{\"module\":\"CommonJS\",\"moduleResolution\":\"node\",\"esModuleInterop\":true}' \
              prisma/seed.ts 2>&1
          " || echo "WARNING: Seed exited non-zero (may be partial or already seeded)"

          # ── Restart both after seed to clear stale connections ────────────
          echo "=== Restarting API + Frontend after seed ==="
          docker compose restart api
          sleep 10
          docker compose restart app
          sleep 15

          # ── Ensure uploads volume is writable ────────────────────────────
          docker compose exec -T -u root app \
            sh -c "mkdir -p /app/public/uploads && chown -R nextjs:nodejs /app/public/uploads" \
          || true

          # ── Verify env vars loaded ────────────────────────────────────────
          echo "=== Verifying API container env ==="
          docker compose exec -T api sh -c 'echo "DB_URL set:   $([ -n "$DATABASE_URL" ] && echo YES || echo NO)"'
          docker compose exec -T api sh -c 'echo "JWT_SECRET:   $([ -n "$JWT_SECRET"    ] && echo YES || echo NO)"'
          docker compose exec -T api sh -c 'echo "GROQ_KEY:     $([ -n "$GROQ_API_KEY"  ] && echo YES || echo NO)"'

          # ── Smoke test: login through the full stack ──────────────────────
          echo "=== Smoke test: login via Next.js proxy → NestJS ==="
          LOGIN=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"emma.johnson@mediwyz.com","password":"Patient123!"}')
          echo "Login result: $LOGIN"
          echo "$LOGIN" | grep -q '"success":true' \
            && echo "SMOKE TEST PASSED" \
            || echo "WARNING: Smoke test failed — check NestJS logs"

          # ── Reload reverse proxy (Caddy if migrated, nginx otherwise) ──────────
          if command -v caddy >/dev/null 2>&1 && systemctl is-active caddy >/dev/null 2>&1; then
            DOMAIN="$APP_DOMAIN"
            {
              echo "${DOMAIN}, www.${DOMAIN} {"
              echo "    reverse_proxy /socket.io/* localhost:3001"
              echo "    reverse_proxy localhost:3000"
              echo "    encode gzip"
              echo "}"
            } | sudo tee /etc/caddy/Caddyfile > /dev/null
            sudo caddy validate --config /etc/caddy/Caddyfile \
              && sudo systemctl reload caddy \
              && echo "Caddy reloaded (HTTPS managed automatically)"
          elif command -v nginx >/dev/null 2>&1; then
            DOMAIN="$APP_DOMAIN"
            CERT_DIR=$(ls -d /etc/letsencrypt/live/${DOMAIN}* 2>/dev/null | head -1 || true)
            HAS_CERT=0
            [ -n "$CERT_DIR" ] && [ -f "$CERT_DIR/fullchain.pem" ] && HAS_CERT=1
            if [ "$HAS_CERT" = "1" ]; then
              {
                echo "server {"
                echo "    listen 80;"
                echo "    server_name ${DOMAIN} www.${DOMAIN};"
                echo "    return 301 https://\$host\$request_uri;"
                echo "}"
                echo "server {"
                echo "    listen 443 ssl;"
                echo "    server_name ${DOMAIN} www.${DOMAIN};"
                echo "    ssl_certificate     ${CERT_DIR}/fullchain.pem;"
                echo "    ssl_certificate_key ${CERT_DIR}/privkey.pem;"
                echo "    ssl_protocols TLSv1.2 TLSv1.3;"
                echo "    ssl_ciphers HIGH:!aNULL:!MD5;"
                echo "    location / {"
                echo "        proxy_pass http://localhost:3000;"
                echo "        proxy_http_version 1.1;"
                echo "        proxy_set_header Upgrade \$http_upgrade;"
                echo "        proxy_set_header Connection upgrade;"
                echo "        proxy_set_header Host \$host;"
                echo "        proxy_set_header X-Real-IP \$remote_addr;"
                echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;"
                echo "        proxy_set_header X-Forwarded-Proto \$scheme;"
                echo "        client_max_body_size 50M;"
                echo "    }"
                echo "    location /socket.io/ {"
                echo "        proxy_pass http://localhost:3001;"
                echo "        proxy_http_version 1.1;"
                echo "        proxy_set_header Upgrade \$http_upgrade;"
                echo "        proxy_set_header Connection upgrade;"
                echo "        proxy_set_header Host \$host;"
                echo "    }"
                echo "}"
              } | sudo tee /etc/nginx/sites-available/mediwyz > /dev/null
              sudo ln -sf /etc/nginx/sites-available/mediwyz /etc/nginx/sites-enabled/mediwyz
              sudo rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
              sudo nginx -t && sudo systemctl reload nginx && echo "nginx HTTPS configured"
            else
              echo "No SSL cert found — run fix-vps-sudo workflow to provision cert"
            fi
          fi

          # ── Final cleanup ─────────────────────────────────────────────────
          docker image prune -f 2>/dev/null || true
          echo "=== Deployment complete ==="

        env:
          GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR:            ${{ github.actor }}
          FRONTEND_IMAGE:      ${{ needs.build-frontend.outputs.image_tag }}
          BACKEND_IMAGE:       ${{ needs.build-backend.outputs.image_tag }}
          APP_URL:             ${{ secrets.APP_DOMAIN != '' && format('https://{0}', secrets.APP_DOMAIN) || format('http://{0}', secrets.VPS_HOST) }}
          DB_URL:              ${{ secrets.DATABASE_URL || format('postgresql://mediwyz:{0}@db:5432/mediwyz', secrets.POSTGRES_PASSWORD) }}
          JWT_SECRET:          ${{ secrets.JWT_SECRET }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          POSTGRES_PASSWORD:   ${{ secrets.POSTGRES_PASSWORD }}
          SUPER_ADMIN_EMAIL:   ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          SUPER_ADMIN_FIRST_NAME: ${{ secrets.SUPER_ADMIN_FIRST_NAME }}
          SUPER_ADMIN_LAST_NAME:  ${{ secrets.SUPER_ADMIN_LAST_NAME }}
          DEPLOY_DIR:          ${{ secrets.DEPLOY_DIR }}
          APP_DOMAIN:          ${{ secrets.APP_DOMAIN }}
          ADMIN_EMAIL:         ${{ secrets.SUPER_ADMIN_EMAIL }}
          ALLOW_DB_RESET:      ${{ secrets.ALLOW_DB_RESET }}
          SENTRY_DSN:          ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG:          ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:      ${{ secrets.SENTRY_PROJECT }}

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep mediwyz || true

          echo ""
          echo "=== Health Checks ==="
          curl -s http://localhost:3001/api/health \
            && echo "API:      healthy" \
            || echo "API:      NOT RESPONDING"

          if curl -sk https://${{ secrets.APP_DOMAIN }}/ > /dev/null 2>&1; then
            echo "Frontend: healthy (HTTPS)"
          elif curl -s http://localhost:3000 > /dev/null 2>&1; then
            echo "Frontend: healthy (HTTP)"
          else
            echo "Frontend: NOT RESPONDING"
          fi

          echo ""
          echo "=== Resource Usage ==="
          free -h | grep Mem
          df -h / | tail -1

  # ─── E2E Smoke Tests (post-deploy, GitHub-hosted) ────────────────────────
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for app to be ready (post-deploy warmup)
        id: preflight
        env:
          BASE_URL: ${{ secrets.APP_DOMAIN != '' && format('https://{0}', secrets.APP_DOMAIN) || format('http://{0}', secrets.VPS_HOST) }}
        run: |
          echo "Polling $BASE_URL for up to 3 minutes..."
          ATTEMPTS=0
          MAX=36
          while [ $ATTEMPTS -lt $MAX ]; do
            ATTEMPTS=$((ATTEMPTS + 1))
            HTTP=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$BASE_URL" 2>/dev/null || echo "000")
            echo "Attempt $ATTEMPTS/$MAX — HTTP $HTTP"
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "301" ] || [ "$HTTP" = "302" ]; then
              echo "reachable=true" >> $GITHUB_OUTPUT
              echo "App ready (HTTP $HTTP)"
              # Extra pause so Next.js hydration stabilises after cold start
              sleep 10
              exit 0
            fi
            sleep 5
          done
          echo "reachable=false" >> $GITHUB_OUTPUT
          echo "::warning::$BASE_URL did not become ready after $((MAX * 5))s — skipping E2E."

      - name: Run E2E smoke tests
        if: steps.preflight.outputs.reachable == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.APP_DOMAIN != '' && format('https://{0}', secrets.APP_DOMAIN) || format('http://{0}', secrets.VPS_HOST) }}
        run: |
          npx playwright test --project=chromium \
            e2e/home.spec.ts \
            e2e/login.spec.ts \
            e2e/golden-path.spec.ts \
            e2e/search.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
