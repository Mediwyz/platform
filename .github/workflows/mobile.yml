name: Mobile — Flutter Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/lib/**'
      - 'mobile/test/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/pubspec.lock'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/lib/**'
      - 'mobile/test/**'
      - 'mobile/pubspec.yaml'
  workflow_dispatch:

jobs:
  # ─── Android APK ─────────────────────────────────────────────────────────
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform files
        run: flutter create --platforms=android --org=com.mediwyz --project-name=mediwyz_mobile .

      - name: Add location permissions to AndroidManifest
        # `flutter create` regenerates a minimal manifest (android/ is gitignored).
        # geolocator_android deliberately doesn't declare location permissions —
        # the app must opt in — so inject them before <application> for "near me".
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' \
            android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml

      - name: Tune Gradle/Kotlin for CI memory
        # `flutter create` regenerates android/ (the dir is gitignored), so this
        # tuning can't live in a committed gradle.properties. History:
        #   - default forked worker @ -Xmx8G → worker OOM-killed.
        #   - in-process @ -Xmx4G/1G-metaspace → "Compilation error" (no e: lines),
        #     i.e. the single JVM running Gradle + Kotlin + R8 starved.
        # ubuntu-latest runners have ~16 GB, so give the in-process JVM real
        # headroom: 6G heap + 2G metaspace (~8G total, fits comfortably).
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m"
            echo "kotlin.compiler.execution.strategy=in-process"
            echo "kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build apk --release \
            -t lib/main_agentic.dart \
            --dart-define=API_BASE=https://mediwyz.com/api \
            --dart-define=SOCKET_URL=https://mediwyz.com \
            --dart-define=SENTRY_DSN=${SENTRY_DSN:-}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediwyz-android-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ─── iOS (macOS runner) ──────────────────────────────────────────────────
  ios:
    name: Build iOS (no-codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS platform files
        run: flutter create --platforms=ios --org=com.mediwyz --project-name=mediwyz_mobile .

      - name: Set iOS minimum deployment target
        run: |
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || \
          sed -i '' "s/platform :ios, '[0-9.]*/platform :ios, '13.0/" ios/Podfile || \
          echo "platform :ios, '13.0'" >> ios/Podfile

      - name: Apply custom Info.plist permissions
        run: |
          cat > ios/Runner/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleDisplayName</key><string>MediWyz</string>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>com.mediwyz.mobile</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>mediwyz_mobile</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$(FLUTTER_BUILD_NAME)</string>
            <key>CFBundleSignature</key><string>????</string>
            <key>CFBundleVersion</key><string>$(FLUTTER_BUILD_NUMBER)</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
            <key>UIMainStoryboardFile</key><string>Main</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UIViewControllerBasedStatusBarAppearance</key><false/>
            <key>NSCameraUsageDescription</key><string>MediWyz needs camera access for video consultations with your healthcare provider.</string>
            <key>NSMicrophoneUsageDescription</key><string>MediWyz needs microphone access for video and audio consultations.</string>
            <key>NSPhotoLibraryUsageDescription</key><string>MediWyz needs photo library access to upload profile photos and documents.</string>
            <key>NSPhotoLibraryAddUsageDescription</key><string>MediWyz needs permission to save images to your photo library.</string>
            <key>NSLocationWhenInUseUsageDescription</key><string>MediWyz uses your location to find healthcare providers near you.</string>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsLocalNetworking</key><true/>
            </dict>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
              <string>fetch</string>
              <string>remote-notification</string>
              <string>voip</string>
            </array>
          </dict>
          </plist>
          PLIST

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (no-codesign)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build ios --release --no-codesign \
            -t lib/main_agentic.dart \
            --dart-define=API_BASE=https://mediwyz.com/api \
            --dart-define=SOCKET_URL=https://mediwyz.com \
            --dart-define=SENTRY_DSN=${SENTRY_DSN:-}

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mediwyz-ios-release
          path: mobile/build/ios/iphoneos/Runner.app
          retention-days: 14
